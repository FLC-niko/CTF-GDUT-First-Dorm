# Competition profile template. Copy and adapt after M6/M7 acceptance.
# Do not commit credentials, private addresses, or unverified model IDs.
version: 1
status: example-not-frozen

safety:
  auto_submit: false
  redact_secrets_in_logs: true
  candidate_flag_isolation: true
  allow_paid_api_fallback: false

# Model IDs are intentionally empty. Populate them from provider discovery and
# benchmark evidence; do not infer roles from names such as "mini" or "pro".
models:
  fast: []
  fast_timeout_seconds: 300
  expert: []
  expert_timeout_seconds: 900
  racing: []
  racing_timeout_seconds: 1800

# Worker topology belongs in a separate local worker config referenced through
# WORKER_CONFIG_FILE. Use SSH aliases/keys, never passwords in YAML.
workers:
  config_file: ""
  local_native_arch: ""

# These conservative defaults can be overridden per host. A controller with
# limited RAM should lower concurrency instead of hard-coding a machine type.
sandbox:
  image: ctf-sandbox
  memory_limit: 4g
  cpu_limit: 2.0
  pids_limit: 512
  max_concurrent_containers: 2
  security_profile: auto
  network_mode: bridge

state:
  # Empty means the CLI chooses .ctf-agent-state.json beside the challenge root.
  file: ""
